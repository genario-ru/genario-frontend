name: Build & Deploy

on:
  push:
    branches:
      - main
      - stage

env:
  REGISTRY: ghcr.io
  IMAGE_SERVICE: genario-frontend
  IMAGE_TAG: latest
  RELEASE: ${{ github.sha }}
  GLITCHTIP_DIST_DIR: .tmp/glitchtip-dist

jobs:
  prepare:
    name: Prepare deployment variables
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == github.event.repository.default_branch && 'production' || github.ref_name }}
    outputs:
      deploy_environment: ${{ steps.vars.outputs.deploy_environment }}
      image_name: ${{ steps.vars.outputs.image_name }}
      image_tag: ${{ steps.vars.outputs.image_tag }}

    steps:
      - name: Resolve deployment variables
        id: vars
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          IMAGE_SERVICE: ${{ env.IMAGE_SERVICE }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_NAME}" == "${DEFAULT_BRANCH}" ]]; then
            deploy_environment="production"
          else
            deploy_environment="${GITHUB_REF_NAME}"
          fi

          echo "deploy_environment=${deploy_environment}" >> "$GITHUB_OUTPUT"
          echo "image_name=${GITHUB_REPOSITORY_OWNER}/${IMAGE_SERVICE}-${deploy_environment}" >> "$GITHUB_OUTPUT"
          echo "image_tag=latest" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build, upload sourcemaps & push image
    runs-on: ubuntu-latest
    needs: prepare
    environment:
      name: ${{ needs.prepare.outputs.deploy_environment }}
    permissions:
      contents: read
      packages: write
    env:
      DEPLOY_ENVIRONMENT: ${{ needs.prepare.outputs.deploy_environment }}
      IMAGE_NAME: ${{ needs.prepare.outputs.image_name }}
      IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
      SENTRY_URL: ${{ secrets.GLITCHTIP_URL }}
      SENTRY_AUTH_TOKEN: ${{ secrets.GLITCHTIP_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.GLITCHTIP_ORG }}
      SENTRY_PROJECT: ${{ secrets.GLITCHTIP_PROJECT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ env.IMAGE_TAG }}

      - name: Validate GlitchTip configuration
        shell: bash
        env:
          VITE_BASE_URL: ${{ secrets.VITE_BASE_URL }}
          VITE_BASE_API_URL: ${{ secrets.VITE_BASE_API_URL }}
          VITE_GLITCHTIP_DSN: ${{ secrets.VITE_GLITCHTIP_DSN }}
        run: |
          set -euo pipefail

          : "${SENTRY_URL:?Missing GLITCHTIP_URL secret}"
          : "${SENTRY_AUTH_TOKEN:?Missing GLITCHTIP_AUTH_TOKEN secret}"
          : "${SENTRY_ORG:?Missing GLITCHTIP_ORG secret}"
          : "${SENTRY_PROJECT:?Missing GLITCHTIP_PROJECT secret}"
          : "${DEPLOY_ENVIRONMENT:?Missing deploy environment value}"
          : "${IMAGE_NAME:?Missing image name value}"
          : "${VITE_BASE_URL:?Missing VITE_BASE_URL secret}"
          : "${VITE_BASE_API_URL:?Missing VITE_BASE_API_URL secret}"
          : "${VITE_GLITCHTIP_DSN:?Missing VITE_GLITCHTIP_DSN secret}"

      - name: Install Sentry CLI
        run: npm install --global @sentry/cli

      - name: Export dist for GlitchTip sourcemaps
        uses: docker/build-push-action@v5
        with:
          context: .
          target: dist-assets
          outputs: type=local,dest=${{ env.GLITCHTIP_DIST_DIR }}
          build-args: |
            VITE_BASE_URL=${{ secrets.VITE_BASE_URL }}
            VITE_BASE_API_URL=${{ secrets.VITE_BASE_API_URL }}
            VITE_YANDEX_METRIKA_ID=${{ secrets.VITE_YANDEX_METRIKA_ID }}
            VITE_GLITCHTIP_DSN=${{ secrets.VITE_GLITCHTIP_DSN }}
            VITE_GLITCHTIP_ENVIRONMENT=${{ env.DEPLOY_ENVIRONMENT }}
            VITE_GLITCHTIP_RELEASE=${{ env.RELEASE }}

      - name: Upload GlitchTip sourcemaps
        shell: bash
        run: |
          set -euo pipefail

          dist_dir="${GLITCHTIP_DIST_DIR}/app"

          echo "Found $(find "$dist_dir" -type f -name '*.map' | wc -l) sourcemap files before upload"
          sentry-cli releases new "$RELEASE" || sentry-cli releases info "$RELEASE" > /dev/null
          sentry-cli sourcemaps inject "$dist_dir"
          echo "Injected debug IDs into $(grep -R --include='*.js' -l 'debugId' "$dist_dir" | wc -l) JavaScript files"
          sentry-cli sourcemaps upload "$dist_dir" --release "$RELEASE"
          find "$dist_dir" -type f -name '*.map' -delete
          sentry-cli releases finalize "$RELEASE"

      - name: Build and push injected GlitchTip dist
        uses: docker/build-push-action@v5
        with:
          context: .
          target: prebuilt-dist
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PREBUILT_DIST_DIR=${{ env.GLITCHTIP_DIST_DIR }}/app

      - name: Record GlitchTip deploy
        run: sentry-cli releases deploys "$RELEASE" new --env "$DEPLOY_ENVIRONMENT" --url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  deploy:
    name: Trigger Dokploy deployment
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build-and-push
    environment:
      name: ${{ needs.prepare.outputs.deploy_environment }}

    steps:
      - name: Trigger Dokploy deployment
        uses: benbristow/dokploy-deploy-action@0.2.2
        with:
          api_token: ${{ secrets.DOKPLOY_API_TOKEN }}
          application_id: ${{ secrets.DOKPLOY_APPLICATION_ID }}
          dokploy_url: ${{ secrets.DOKPLOY_URL }}
          service_type: application
